name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --extra dev
      - run: npm ci
      - run: uv run python scripts/build-synthetic-fonts.py
      - run: uv run fontschema generate
      - run: npm run generate
      - run: git diff --exit-code -- schemas generated/typescript generated/zod
      - run: uv run pytest -q
      - run: npm test
