[project]
name = "font-format-schema"
version = "0.1.0"
description = "Variation-focused schema extraction and validation for TTX/OpenType, Designspace and UFO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fonttools==4.64.0",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
fontschema = "fontschema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fontschema"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["vendor", "node_modules", ".venv", ".cache"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.11"
